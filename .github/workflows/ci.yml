name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Zig
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Check formatting
        run: zig fmt --check build.zig src
      - name: Build release binary
        run: zig build --release=fast --summary all
      - name: Run unit tests
        run: zig build test --summary all
      # The engine compiles the kernels at start, which needs a model and a GPU. This catches
      # errors in the shader source without them.
      - name: Compile Metal kernels
        run: xcrun -sdk macosx metal -c src/kernels.metal -o /dev/null
